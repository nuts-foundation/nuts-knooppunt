# Default values for gf-sandbox.

replicaCount: 1

image:
  repository: ghcr.io/nuts-foundation/gf-sandbox
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion ("main" -
  # this image only ever gets a "main" tag today, no semver releases yet).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8091

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe: {}
readinessProbe: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# gf-sandbox's own environment. All of these are placeholders for standalone
# use of this chart - the nuts-knooppunt umbrella chart overrides them to
# the actual in-cluster service addresses and public ingress hostnames.
env:
  deziPublicAuthorizeUrl: "http://localhost:8092/authorize"
  deziInternalBaseUrl: "http://mock-dezi:8092"
  sandboxPublicUrl: "http://localhost:8091"
  knooppuntInternalUrl: "http://knooppunt:8081"
  hapiBaseUrl: "http://fhir:8080/fhir"
  # De Plataan's URA (test/testdata/vectors/plataan.URA) - matches
  # sandbox/app/nuts.go's own default and what the seed pipeline
  # (test/testdata/cmd/main.go) creates the Nuts subject under in every
  # environment, so no environment needs to override this.
  nutsSubject: "00000010"

# De Zonnebloem's EHR (sandbox/zonnebloem), which gf-sandbox serves on its own
# port when enabled, reading and writing only the FHIR store at fhirBaseUrl.
# An ingress host reaches it with servicePort set to this port. publicUrl is
# where browsers reach it: Plataan's patient record links there, and shows no
# link while it is empty.
zonnebloemEhr:
  enabled: false
  port: 3001
  fhirBaseUrl: ""
  publicUrl: ""

# PRS evidence in the viewer (sandbox/app/README.md, "Private PRS trace
# receiver"): the knooppunt exports to an OpenTelemetry Collector deployed by
# this chart (set its config.tracing.otlpendpoint to
# <fullname>-otel-collector:4318), which forwards traces to the sandbox's
# private OTLP listener with a generated ingest token. That listener gets a
# ClusterIP service of its own (<fullname>-otlp), which no ingress routes to.
# Off by default, and then the viewer says the deployment does not trace the
# PRS call.
traceCapture:
  enabled: false
  # The PRS base URL whose client spans become viewer events. Must equal the
  # knooppunt's pseudo.prsurl. Required when enabled.
  prsUrl: ""
  # The service.name the knooppunt reports (its tracing.servicename).
  serviceName: "nuts-knooppunt"
  # The sandbox's private OTLP listener (SANDBOX_OTLP_LISTEN_ADDR).
  listenPort: 4318
  collector:
    image:
      repository: otel/opentelemetry-collector
      tag: "0.123.0"
      pullPolicy: IfNotPresent
    # The memory_limiter in the Collector's config (96 MiB) is sized for this
    # limit; change them together.
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
