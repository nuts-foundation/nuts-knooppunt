apiVersion: v2
name: helm-nuts-knooppunt
description: Helm chart for nuts-knooppunt

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
# NOTE: Automatically set by CI/CD from git tag version.
version: 0.0.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
# NOTE: Automatically set by CI/CD from git tag version.
appVersion: "0.0.0"

dependencies:
  - name: helm-fhir
    alias: fhir
    condition: fhir.enabled
    repository: oci://ghcr.io/nuts-foundation
    version: "0.1.2"
  # Compose runs one PEP per demo organization (pep-zonnebloem, pep-plataan) -
  # same image, different config - so this chart is depended on twice under
  # different aliases rather than once.
  - name: helm-pep
    alias: pep-zonnebloem
    condition: pep-zonnebloem.enabled
    repository: oci://ghcr.io/nuts-foundation
    version: "0.1.1"
  - name: helm-pep
    alias: pep-plataan
    condition: pep-plataan.enabled
    repository: oci://ghcr.io/nuts-foundation
    version: "0.1.1"
  - name: helm-nuts-admin
    alias: nutsadmin
    condition: nutsadmin.enabled
    repository: oci://ghcr.io/nuts-foundation
    version: "0.1.0"
  - name: helm-mock-vc-issuer
    alias: mock-vc-issuer
    condition: mock-vc-issuer.enabled
    repository: file://../mock-vc-issuer
    version: "0.1.0"
  - name: helm-mock-mitz
    alias: mock-mitz
    condition: mock-mitz.enabled
    repository: file://../mock-mitz
    version: "0.1.0"
  - name: helm-mock-dezi
    alias: mock-dezi
    condition: mock-dezi.enabled
    repository: file://../mock-dezi
    version: "0.1.0"
  - name: helm-gf-sandbox
    alias: gf-sandbox
    condition: gf-sandbox.enabled
    repository: file://../gf-sandbox
    version: "0.1.0"
  - name: nuts-node-chart
    alias: nuts
    condition: nuts.enabled
    repository: https://nuts-foundation.github.io/nuts-node/
    version: "0.0.6"
  - name: jaeger
    condition: jaeger.enabled
    repository: https://jaegertracing.github.io/helm-charts
    version: "3.4.1"
