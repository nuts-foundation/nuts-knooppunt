apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nuts-knooppunt.fullname" . }}
  labels:
    {{- include "nuts-knooppunt.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  # The data volume is ReadWriteOnce: the old pod must release it before the
  # new one can mount it.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "nuts-knooppunt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nuts-knooppunt.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nuts-knooppunt.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.database.enabled .Values.extraEnv }}
          env:
            {{- if .Values.database.enabled }}
            - name: NUTS_STORAGE_SQL_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ include "nuts-knooppunt.database.secretName" (dict "ctx" . "name" "nuts") }}
                  key: uri
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: internal
              containerPort: {{ .Values.service.internalPort }}
              protocol: TCP
            - name: public
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "nuts-knooppunt.fullname" . }}-config
            items:
              - key: knooppunt.yml
                path: knooppunt.yml
              - key: nuts.yml
                path: nuts.yml
              {{- range $id, $definition := .Values.discoveryDefinitions }}
              - key: discovery-{{ $id }}.json
                path: discovery/{{ $id }}.json
              {{- end }}
              {{- range $filename, $document := .Values.policyDocuments }}
              - key: policy-{{ $filename }}
                path: policy/{{ $filename }}
              {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nuts-knooppunt.fullname" . }}-data
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
