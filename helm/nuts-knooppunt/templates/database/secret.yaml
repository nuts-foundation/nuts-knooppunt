{{- if .Values.database.enabled }}
{{- range .Values.database.databases }}
{{- $name := . }}
{{- $secretName := include "nuts-knooppunt.database.secretName" (dict "ctx" $ "name" $name) }}
{{- /* Keep the password stable across upgrades: reuse the one already in the
       cluster, generate one only on first install. */}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
# Credentials for one component's database. username/password are what
# CloudNativePG reads to manage the role (the Secret must be of type
# kubernetes.io/basic-auth for that); uri is the ready-made connection string
# for the component itself, already in the postgres:// form the nuts-node
# expects.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "nuts-knooppunt.labels" $ | nindent 4 }}
  annotations:
    # Kept on uninstall together with the Cluster (see cluster.yaml): the
    # data is useless without the password to it.
    "helm.sh/resource-policy": keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ $name }}
  password: {{ $password }}
  uri: postgres://{{ $name }}:{{ $password }}@{{ include "nuts-knooppunt.database.clusterName" $ }}-rw:5432/{{ $name }}
{{- end }}
{{- end }}
