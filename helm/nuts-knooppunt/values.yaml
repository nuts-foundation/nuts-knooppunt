# Default values for nuts-knooppunt.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/nuts-foundation/nuts-knooppunt
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # NOTE: Leave empty - automatically set by CI/CD to match git tag version.
  # The deployment template uses .Chart.AppVersion when this is empty.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
# Pinned so the other subcharts (pep-zonnebloem, pep-plataan, nutsadmin) can
# reference this service by a fixed hostname regardless of release name -
# same reasoning as fhir/nuts/mock-vc-issuer's own fullnameOverride below.
fullnameOverride: "nuts-knooppunt"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080
  internalPort: 8081

gateway:
  enabled: false
  className: ""
  name: nuts-knooppunt

# This block is for setting up the httpRoute for more information can be found here: https://gateway-api.sigs.k8s.io/api-types/httproute/
httpRoute:
  enabled: false
  hostnames:
    - nuts-knooppunt.localhost
  parentRefs:
    - name: nuts-knooppunt

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /status
    port: internal
readinessProbe:
  httpGet:
    path: /status
    port: internal

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Extra container env vars, e.g. NUTS_URL (the embedded nuts-node's own
# public base URL, used for did:web identifiers - the nutsnode component
# sets several other NUTS_* vars itself, but not this one) or sandbox-only
# settings like NUTS_VCR_DEZI_ALLOWEDJKU / SSL_CERT_FILE.
extraEnv: []
# - name: NUTS_URL
#   value: "https://knooppunt.example.com"

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Nuts Knooppunt application configuration
# This is rendered into knooppunt.yml ConfigMap
config:
  # HTTP interface configuration
  http:
    public:
      address: ":8080"  # TCP address for public HTTP interface
      # url: ""  # Optional: Public base URL (e.g., https://public.example.com). If not specified, defaults to http://<hostname>:<port>
    internal:
      address: ":8081"  # TCP address for internal HTTP interface
      # url: ""  # Optional: Internal base URL (e.g., http://internal.example.com). If not specified, defaults to http://<hostname>:<port>

  # mCSD (Mobile Care Services Discovery) configuration
  mcsd:
    # Administration directories to synchronize from
    # admin:
    #   "example-org":
    #     fhirbaseurl: "https://fhir.example.org/fhir"
    #   "another-org":
    #     fhirbaseurl: "https://fhir.another-org.com/fhir"

    # Local FHIR directory configuration (query directory)
    query:
      fhirbaseurl: "http://fhir:8080/fhir"

    # Exclude administration directories from being registered
    # Use this to prevent your own FHIR server from being added as an admin directory
    # This avoids syncing your own resources back to yourself
    adminexclude:
      - "http://fhir:8080/fhir"  # Exclude own query directory
      # - "https://fhir.other-excluded.org/fhir"  # Add more exclusions as needed

    # Resource types to synchronize from discovered mCSD directories
    # If not specified, defaults to: Organization, Endpoint, Location, HealthcareService, PractitionerRole, Practitioner
    # directoryresourcetypes:
    #   - "Organization"
    #   - "Endpoint"
    #   - "Location"
    #   - "HealthcareService"
    #   - "PractitionerRole"
    #   - "Practitioner"

  # mCSD Admin configuration (web interface)
  # mcsdadmin:
  #   fhirbaseurl: "http://fhir:8080/fhir"

  # MITZ Connector configuration
  # mitz:
  #   mitzbase: "http://mitz-server:8087/tst-us/mitz"
  #   gatewaysystem: "urn:oid:2.16.840.1.113883.2.4.6.6.1"
  #   sourcesystem: "urn:oid:2.16.840.1.113883.2.4.6.6.90000017"

  # PDP (Policy Decision Point) configuration
  # pdp:
  #   enabled: true

  # Nuts node configuration. Enabled by default, matching config/knooppunt.yml:
  # without this the embedded nuts-node never starts, and everything under
  # /nuts/* (including nutsadmin's identities API) 404s.
  nuts:
    enabled: true

  # OpenTelemetry tracing configuration
  # Set otlpendpoint to enable tracing.
  # When jaeger.enabled is true, the collector service is: <helm-release-name>-jaeger-collector:4318
  # The helm release name is what you pass to "helm install <release-name> ..."
  tracing:
    otlpendpoint: ""  # e.g., "my-release-jaeger-collector:4318"
    insecure: true
    servicename: "nuts-knooppunt"

# The embedded Nuts node's own config file (component/nutsnode/component.go
# reads it from the hardcoded path config/nuts.yml, separate from
# knooppunt.yml above). policy.directory and discovery.definitions.directory
# point at where this chart mounts policyDocuments/discoveryDefinitions below
# - leave them as-is.
nutsConfig:
  didmethods:
    - web
  auth:
    contractvalidators:
      - dummy
  policy:
    directory: "./config/policy"
  discovery:
    definitions:
      directory: "./config/discovery"
    server:
      ids: []

# Discovery service definitions this node is a client of, keyed by service ID
# (each becomes discovery/<id>.json) - values are raw JSON text, not parsed
# objects. Environment- and use-case-specific: there can be any number of
# them (including zero), so an environment supplies these via
# `--set-file discoveryDefinitions.<id>=path/to/<id>.json` for each file it
# has, rather than inlining them here. See infra/ovhcloud-sandbox/deploy.sh.
discoveryDefinitions: {}

# Access policy documents for nutsConfig.policy.directory above, keyed by
# filename (each becomes policy/<filename>) - same reasoning and --set-file
# mechanism as discoveryDefinitions.
policyDocuments: {}

# Hapi FHIR configuration
fhir:
  enabled: false
  fullnameOverride: fhir
  multitenancy:
    enabled: false
  postgres:
    enabled: true
  gateway:
    enabled: false
  configExtra:
    # Lets the server generate UUIDs for resources instead of integers
    "hapi.fhir.server_id_strategy": "UUID"
    # Allow storing of meta.source as provided by the client (used by mCSD to reference the originating resource)
    "hapi.fhir.store_meta_source_information": "SOURCE_URI"
    # Prevents encoding of the pipe char in queries
    "server.tomcat.relaxed-query-chars": "|"
    # The FHIR version to use
    "hapi.fhir.version": "R4"

# Policy Enforcement Point for Zorgcentrum De Zonnebloem (data holder on the
# AC1 demo path - the seeded pool patients live in its tenant).
# Set enabled: true to deploy it.
pep-zonnebloem:
  enabled: false
  fullnameOverride: pep-zonnebloem
  env:
    fhirBackendHost: "fhir"
    fhirBackendPort: "8080"
    knooppuntPdpHost: "nuts-knooppunt"
    nutsNodeHost: "nuts-knooppunt"
    dataHolderOrganizationUra: "00000020"

# Policy Enforcement Point for Ziekenhuis De Plataan (requester on the AC1
# demo path). Set enabled: true to deploy it.
pep-plataan:
  enabled: false
  fullnameOverride: pep-plataan
  env:
    fhirBackendHost: "fhir"
    fhirBackendPort: "8080"
    knooppuntPdpHost: "nuts-knooppunt"
    nutsNodeHost: "nuts-knooppunt"
    dataHolderOrganizationUra: "00000010"

# nuts-admin management UI. Set enabled: true to deploy it.
nutsadmin:
  enabled: false
  fullnameOverride: nutsadmin
  env:
    nutsNodeAddress: "http://nuts-knooppunt:8081/nuts"
  config:
    credentialprofiles:
      - type: HealthcareProviderRoleTypeCredential
        issuer: "http://mock-vc-issuer:3000"

# NUTS Node configuration
# Set enabled: true to enable NUTS node deployment
nuts:
  enabled: false
  fullnameOverride: nuts
  # Environment variables for the NUTS node container
  # The NUTS_STORAGE_SQL_CONNECTION is automatically set from a converted database secret
  # CloudNativePG creates secrets with postgresql:// scheme, but NUTS node requires postgres://
  # A Helm hook job automatically converts the secret format on install/upgrade
  #
  # To configure: Create your own values file (e.g., my-values.yaml) and set:
  #   extraEnv:
  #     - name: NUTS_STORAGE_SQL_CONNECTION
  #       valueFrom:
  #         secretKeyRef:
  #           name: <your-release-name>-nuts-db-fixed
  #           key: uri
  #
  # Example for release name "my-nuts-knooppunt":
  # extraEnv:
  #   - name: NUTS_STORAGE_SQL_CONNECTION
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-nuts-knooppunt-nuts-db-fixed
  #         key: uri
  extraEnv: []
  nuts:
    config:
      url: https://nuts.example.com  # Public URL of the NUTS node
      crypto:
        storage: fs  # Use filesystem storage for crypto keys (alternatives: vaultkv for Vault)
  data:
    persistedVolumeClaim:
      enabled: true
  database:
    storage:
      size: 5Gi

# Mock VC Issuer configuration (OID4VCI Credential Issuer for testing)
# Set enabled: true to deploy the mock Verifiable Credential issuer for VektisOrgCredentials
mock-vc-issuer:
  enabled: false
  fullnameOverride: mock-vc-issuer
  # Override environment variables if needed
  # env:
  #   credentialValidityDays: "365"
  #   accessTokenExpirySeconds: "86400"
  # Ingress configuration
  # ingress:
  #   enabled: true
  #   hosts:
  #     - host: mock-vc-issuer.example.com
  #       paths:
  #         - path: /
  #           pathType: Prefix

# mock-mitz: mock MITZ closed-question consent service. Set enabled: true to
# deploy it. No config beyond enabling it - it takes no config file, and its
# one env var (LISTEN_ADDR) already defaults to the port this chart expects.
mock-mitz:
  enabled: false
  fullnameOverride: mock-mitz

# mock-dezi: mock Dezi (healthcare-professional identity) service. Set
# enabled: true to deploy it. Needs the mock-dezi-certs Secret to exist first
# (see nuts-knooppunt#569 - generated by sandbox/generate-demo-certs.sh and
# loaded by hand, this chart only references it by name).
# mock-dezi's own default deziAllowedRedirectUris (a placeholder pointing at
# localhost, meant to be overridden once a real public ingress hostname
# exists) already matches what we'd otherwise restate here - nothing to
# override at the umbrella level. The actual environment values file
# overrides it directly (see infra/ovhcloud-sandbox/values.yaml).
mock-dezi:
  enabled: false
  fullnameOverride: mock-dezi

# gf-sandbox: the GF Sandbox demo application. Set enabled: true to deploy
# it. Only knooppuntInternalUrl differs from the chart's own defaults - the
# rest (public URLs) are placeholders that depend on ingress hostnames an
# environment values file has to set.
gf-sandbox:
  enabled: false
  fullnameOverride: gf-sandbox
  env:
    knooppuntInternalUrl: "http://nuts-knooppunt:8081"

# Seed Job configuration. Populates a fresh deployment with demo data (FHIR
# test resources, a Nuts subject and X509Credential per demo organization,
# NVI localization records) as a post-install/post-upgrade hook. Re-loads the
# FHIR test fixtures on every run, so hand-made edits to the demo resources
# don't survive an upgrade. For sandbox and demo deployments only - leave
# disabled for production.
seed:
  enabled: false
  image:
    repository: ghcr.io/nuts-foundation/seed
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  # FHIR base URL the seed loads test data into. Matches
  # config.mcsd.query.fhirbaseurl above.
  fhirBaseURL: "http://fhir:8080/fhir"
  # Addresses advertised on discovery and in the mCSD directory for each demo
  # organization - the PEPs, so a resolved address leads through the
  # authorization chain instead of bypassing it (matches docker-compose.yml's
  # SEED_ZONNEBLOEM_ENDPOINT_ADDRESS/SEED_PLATAAN_ENDPOINT_ADDRESS). Fixed
  # internal service names, not environment-specific.
  zonnebloemEndpointAddress: "http://pep-zonnebloem:8080/fhir"
  plataanEndpointAddress: "http://pep-plataan:8080/fhir"

# Jaeger configuration for distributed tracing
# Set enabled: true to deploy Jaeger for trace collection and visualization
jaeger:
  enabled: false
  # Use all-in-one deployment strategy for simplicity (suitable for dev/test)
  # For production, consider using a production deployment with separate components
  provisionDataStore:
    cassandra: false
  allInOne:
    enabled: true
  agent:
    enabled: false  # Not needed when using all-in-one
  collector:
    enabled: false  # Not needed when using all-in-one
  query:
    enabled: false  # Not needed when using all-in-one, query is built into all-in-one
  storage:
    type: memory  # Use "memory" for dev, "cassandra" or "elasticsearch" for production
