# Default values for mock-dezi.

replicaCount: 1

image:
  repository: ghcr.io/nuts-foundation/mock-dezi
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion ("main" -
  # this image only ever gets a "main" tag today, no semver releases yet).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  httpPort: 8092
  httpsPort: 8443

# Ingress for the http port only (8092: /authorize, the browser-facing
# redirect target). The https port (8443, JWKS) is reached over the
# in-cluster Service by knooppunt, never a browser, so it stays ClusterIP-only.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe: {}
readinessProbe: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# mock-dezi's TLS cert, key, and attestation signing key. Generated by
# sandbox/generate-demo-certs.sh (gitignored, never committed) and loaded
# into a Secret by hand - see nuts-knooppunt#569. This chart only references
# the Secret by name; it doesn't create it.
certsSecretName: "mock-dezi-certs"

# mock-dezi environment. deziJku must match the public https:// address
# other services (e.g. knooppunt's NUTS_VCR_DEZI_ALLOWEDJKU) use to reach
# this service - the in-cluster Service DNS name by default.
env:
  deziJku: "https://mock-dezi:8443/dezi/jwks.json"
  # The only callback /authorize will bind - must match whatever public URL
  # the sandbox app is reachable at. Placeholder; override per environment.
  deziAllowedRedirectUris: "http://localhost:8091/demo/auth/callback"

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
