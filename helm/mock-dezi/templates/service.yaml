apiVersion: v1
kind: Service
metadata:
  name: {{ include "mock-dezi.fullname" . }}
  labels:
    {{- include "mock-dezi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "mock-dezi.selectorLabels" . | nindent 4 }}
