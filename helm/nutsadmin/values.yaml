# Default values for nutsadmin.

replicaCount: 1

image:
  repository: nutsfoundation/nuts-admin
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 1305

resources: {}

# No default probes: nuts-admin has no documented health endpoint to check
# against. Set these explicitly if you want liveness/readiness checks.
livenessProbe: {}
readinessProbe: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Additional volumes/volumeMounts on the output Deployment definition.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# The Nuts node internal API this nutsadmin instance manages.
# Placeholder for standalone use of this chart; the nuts-knooppunt umbrella
# chart overrides this to the actual knooppunt service address.
env:
  nutsNodeAddress: "http://knooppunt:8081/nuts"

# Rendered into config.yml (mounted at /app/config.yml, referenced by
# NUTS_CONFIGFILE). See config/nuts-admin.yml in the repo for what nuts-admin
# itself expects here.
config:
  credentialprofiles:
    - type: HealthcareProviderRoleTypeCredential
      issuer: "http://mock-vc-issuer:3000"
