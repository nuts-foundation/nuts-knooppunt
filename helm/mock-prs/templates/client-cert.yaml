{{- /*
A client certificate for the knooppunt to mount as authn.minvws.tlscertfile and
tlskeyfile. component/authn refuses a token endpoint without one and signs its
token request assertion with the key (RS256, hence RSA). The mock speaks plain
HTTP and checks neither, so a self-signed one does. Generated on install and
carried over on upgrade, so the knooppunt's mounted files never change under it.
*/ -}}
{{- $name := printf "%s-client-cert" (include "mock-prs.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mock-prs.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if $existing }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $cert := genSelfSignedCert "knooppunt sandbox client" nil nil 3650 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
