apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mock-prs.fullname" . }}
  labels:
    {{- include "mock-prs.labels" . | nindent 4 }}
spec:
  # One replica on a ReadWriteOnce volume: the old pod must release the keys
  # before the new one can mount them.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mock-prs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mock-prs.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mock-prs.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: SANDBOX_LISTEN_ADDR
              value: ":{{ .Values.service.sandboxPort }}"
            - name: PUBLIC_URL
              value: {{ .Values.env.publicUrl | default (printf "http://%s:%v" (include "mock-prs.fullname" .) .Values.service.port) | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: sandbox
              containerPort: {{ .Values.service.sandboxPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The image's RECIPIENT_KEY_FILE and OPRF_KEY_FILE live here.
            - name: keys
              mountPath: /keys
      volumes:
        - name: keys
          persistentVolumeClaim:
            claimName: {{ include "mock-prs.fullname" . }}-keys
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
