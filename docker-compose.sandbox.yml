# GF Sandbox overrides for the knooppunt service.
#
# These belong in an overlay rather than in docker-compose.yml because the
# knooppunt service is not profile-gated: it starts on a plain
# `docker compose up`. Putting sandbox-only settings on it would change the
# stack for everyone who never runs the sandbox.
#
# Usage, from the repo root:
#
#   ./sandbox/generate-demo-certs.sh     # once, writes to the gitignored sandbox/.certs/
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml --profile sandbox up
#
# No separate bootstrap step: the seed (the `init` service, docker-compose.yml)
# creates De Plataan's Nuts subject and issues its X509Credential from the
# Fake UZI CA (test/testdata/cmd/main.go), the same credential the bgz policy
# below pins. sandbox/app/README.md gives the same sequence with more context.
#
# The sandbox and mock-dezi services themselves stay in docker-compose.yml
# under the `sandbox` profile; they are self-contained and affect nobody else.
# The mock PRS lives here instead: it exists for the settings below, and the
# material it and the knooppunt need for it is provisioned inside the stack
# (named volumes, see mock-prs and knooppunt-prs-cert), not by the script.

services:
  knooppunt:
    environment:
      KNPT_TRACING_OTLPENDPOINT: sandbox-otel-collector:4318
      OTEL_BSP_SCHEDULE_DELAY: "250"
      # Trust the mock Dezi's JWK Set so the node can verify attestations minted
      # by mock-components/dezi. Setting this REPLACES the built-in defaults
      # rather than adding to them (nuts-node vcr/vcr.go:170-184), so both
      # defaults are repeated here: the production URL, and the acceptance URL
      # that a non-strict node would otherwise have (config/knooppunt.yml sets
      # strictmode: false). Dropping either would silently stop validating
      # attestations from that environment.
      NUTS_VCR_DEZI_ALLOWEDJKU: "https://mock-dezi:8443/dezi/jwks.json,https://auth.dezi.nl/dezi/jwks.json,https://acceptatie.auth.dezi.nl/dezi/jwks.json"

      # The sandbox runs its own policy directory, not the repository's.
      # config/policy carries no bgz scope on purpose: the definition has to
      # pin a CA's did:x509 fingerprint, and a definition without the pin
      # accepts a chain the requester minted itself (nuts-node
      # vdr/didx509/resolver.go builds the trust store out of the
      # credential's own x5c header), so leaving one in the shared config
      # directory would arm that bypass on every plain `docker compose up`,
      # since the knooppunt is not profile-gated and publishes port 8080.
      #
      # Environment rather than config/nuts.yml because the node loads the file
      # first and the environment second into the same koanf map
      # (nuts-node core/server_config.go), so this wins, and because the setting
      # is sandbox-only.
      #
      # It replaces config/policy rather than adding to it: the node takes one
      # directory, not a list (nuts-node policy/config.go). Nothing in this
      # stack requests the eOverdracht scopes that live there, but that is a
      # divergence, not a nicety. A scope added to config/policy will not exist
      # in the sandbox until it is added here too.
      NUTS_POLICY_DIRECTORY: /app/sandbox-policy

      # Pseudonymize through the mock PRS instead of the XOR fake, with the
      # same authn flow as against the ministry: a client certificate, a
      # JWT-bearer token request, a bearer on the PRS call. The audience is
      # the NVI's URA, which is what the mock registers a key for; the fake
      # wanted "nvi" (docs/CONFIGURATION.md). docs/prs-contract.md has the
      # wire contract this pins.
      KNPT_PSEUDO_PRSURL: http://mock-prs:8080
      KNPT_AUTHN_MINVWS_TOKENENDPOINT: http://mock-prs:8080/oauth/token
      # The certificate is not presented to the mock, which speaks plain HTTP;
      # authn refuses a configured token endpoint without one and signs its
      # assertion with this key. knooppunt-prs-cert below generates it.
      KNPT_AUTHN_MINVWS_TLSCERTFILE: /certs/knooppunt-prs.pem
      KNPT_AUTHN_MINVWS_TLSKEYFILE: /certs/knooppunt-prs.key
      KNPT_NVI_AUDIENCE: "90000901"
    depends_on:
      knooppunt-prs-cert:
        condition: service_completed_successfully
    volumes:
      # Generated into a named volume by knooppunt-prs-cert.
      - knooppunt-prs-cert:/certs:ro
      # Generated by sandbox/generate-demo-certs.sh. Without that script this
      # path does not exist and Docker would create a directory here, which is
      # why the mount is not on the base service.
      - ./sandbox/.certs/ca-only/gf-sandbox-demo-ca.pem:/etc/ssl/certs/gf-sandbox-demo-ca.pem:ro

      # Committed, not generated: the bgz presentation definition pins the
      # Fake UZI CA (test/e2e/pep/certs), the same fixed CA the seed issues
      # De Plataan's X509Credential from, so there is nothing per-developer
      # left to render here. The target sits outside /app/config deliberately:
      # that path is already a bind mount from the base file, and nothing here
      # needs to depend on how nested mounts behave. /app is the image's
      # WORKDIR and not a mount, so this is a fresh mountpoint.
      - ./sandbox/policy/bgz.json:/app/sandbox-policy/bgz.json:ro

  # Generates the self-signed certificate the knooppunt signs its token requests
  # to the mock PRS with, once, into the knooppunt-prs-cert volume. The mock
  # never sees it (plain HTTP), so nothing verifies it; it exists because
  # component/authn refuses a token endpoint without one. Owned by the
  # knooppunt image's user (Dockerfile: 18081). `docker compose down -v`
  # discards it.
  knooppunt-prs-cert:
    image: alpine/openssl:3.5.8
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if [ ! -s /certs/knooppunt-prs.key ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -sha256 \
            -subj "/CN=knooppunt sandbox client" \
            -keyout /certs/knooppunt-prs.key -out /certs/knooppunt-prs.pem
          chown 18081:18081 /certs/knooppunt-prs.key /certs/knooppunt-prs.pem
          chmod 0600 /certs/knooppunt-prs.key
        fi
    volumes:
      - knooppunt-prs-cert:/certs
    profiles:
      - sandbox

  # Mock PRS (Pseudoniemendienst): the pseudonymization service as the
  # acceptance environment is documented to run it, plus a stand-in token
  # endpoint and two sandbox-only routes for the NVI. See
  # mock-components/prs/README.md. Only this overlay points the knooppunt at
  # it; without the profile the knooppunt keeps its XOR fake.
  mock-prs:
    build:
      context: .
      dockerfile: mock-components/prs/Dockerfile
    # Always rebuild: a stale image would silently serve an older contract.
    pull_policy: build
    environment:
      # The origin the knooppunt addresses; tokens are issued for it. Plain
      # HTTP: the acceptance environment is behind mTLS, terminated by its
      # ingress, and there is nothing in front of this service inside the
      # compose network.
      PUBLIC_URL: http://mock-prs:8080
      # The unauthenticated sandbox helper for the NVI (finalize and tokenize),
      # reachable from this project's network only: no port is published.
      SANDBOX_LISTEN_ADDR: ":8081"
      # The NVI's URA and scope, as the knooppunt's KNPT_NVI_AUDIENCE names it.
      RECIPIENTS: "90000901:nationale-verwijsindex"
    volumes:
      # The recipient and OPRF keys, created by the service on first start at
      # the image's RECIPIENT_KEY_FILE and OPRF_KEY_FILE; kept here so
      # pseudonyms stay stable across restarts. `down -v` starts afresh.
      - mock-prs-keys:/keys
    profiles:
      - sandbox

  # With the mock PRS in play the tokens the knooppunt registers are real
  # blinded values, which the fake-nvi image cannot turn into a pseudonym.
  # Build the interceptor from source so the PRS-backed resolver in
  # mock-components/nvi is used before a new fake-nvi image is published, and
  # tell it where the mock PRS's sandbox helper is.
  hapi-fhir:
    build:
      context: ./mock-components/nvi/hapi-pseudonimization-interceptor
    # The base file names the published image. With both image and build and
    # no pull policy, Compose pulls first and only builds when the pull fails
    # (compose spec, build: "Using build and image"), which would run the old
    # interceptor without PRS_MOCK_URL support. Build always.
    pull_policy: build
    environment:
      PRS_MOCK_URL: http://mock-prs:8081

  # The service itself is in docker-compose.yml; only these overrides are here.
  gf-sandbox:
    environment:
      # Lets a reset clear captured consent subscriptions, and lets the record
      # screen reconcile a subscription whose response never arrived. Unset means
      # both degrade to "unknown" rather than failing.
      MITZMOCK_URL: http://mitzmock:8080
      SANDBOX_OTLP_LISTEN_ADDR: ":4318"
      SANDBOX_OTLP_TOKEN: ${SANDBOX_OTLP_TOKEN:-sandbox-local-trace-ingest}
      SANDBOX_PRS_URL: http://mock-prs:8080
      SANDBOX_TRACE_SERVICE_NAME: nuts-knooppunt
    # Additive with the base file's depends_on (Compose 5.3.0 merges list and
    # mapping notation additively either way, but matching notation means this
    # does not rest on that). Without this, a node that is merely up says
    # nothing about De Plataan's wallet holding a credential yet, and the
    # authorization route returns a token error the operator has no way to
    # read as "the seed hasn't finished".
    depends_on:
      init:
        condition: service_completed_successfully

  # No host port: trace ingestion stays on the Compose network. The local
  # credential must be overridden for any shared or hosted deployment.
  sandbox-otel-collector:
    image: otel/opentelemetry-collector:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      SANDBOX_OTLP_TOKEN: ${SANDBOX_OTLP_TOKEN:-sandbox-local-trace-ingest}
    volumes:
      - ./sandbox/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 128m
    profiles:
      - sandbox

volumes:
  # Provisioned inside the stack; nothing on the host, nothing committed.
  knooppunt-prs-cert:
  mock-prs-keys:
