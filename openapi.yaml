        organization, without carrying the patient data itself.
      additionalProperties: true
      x-go-type: fhir.List
      x-go-type-import:
        path: github.com/zorgbijjou/golang-fhir-models/fhir-models/fhir
      example:
        resourceType: List
        status: current
        mode: working
        subject:
          identifier:
            system: "http://fhir.nl/fhir/NamingSystem/bsn"
            value: "999911136"
        source:
          identifier:
            system: "http://fhir.nl/fhir/NamingSystem/ura"
            value: "00000020"
        code:
          coding:
            - system: "http://minvws.github.io/generiekefuncties-docs/CodeSystem/nl-gf-data-categories-cs"
              code: MedicationRequest
        extension:
          - url: "http://minvws.github.io/generiekefuncties-docs/StructureDefinition/nl-gf-localization-custodian"
            valueReference:
              identifier:
                system: "http://fhir.nl/fhir/NamingSystem/ura"
                value: "00000020"

