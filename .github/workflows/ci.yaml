---
name: 'Build and deploy sandbox'

# Orchestrates the sandbox's build-then-deploy pipeline on every push to
# main: build every image the sandbox stack uses, then deploy only once all
# of them have finished and published successfully. The individual
# build-*-image.yaml workflows still trigger themselves independently for
# pull_request (their own path filters keep PR checks scoped and fast) and
# for version tags (unrelated to this pipeline) - only their push-to-main
# trigger moved here, since that's the one the deploy job below needs to
# wait on. See nuts-knooppunt#603's follow-up discussion for why a plain
# `push: main` trigger on the deploy alone wasn't enough: it raced the image
# builds (deploy could finish in under a minute, image builds take longer),
# and even a wait wouldn't guarantee every component came from the *same*
# commit - hence pinning every component below to this run's exact commit
# SHA instead of the moving "main" tag.
#
# workflow_dispatch is deploy-only: it redeploys a commit that was already
# built and pushed to main (skipping the 8 build jobs), for rollback or
# retrying a deploy without rebuilding. It only works for a commit that
# already has sha-<short-sha> images published - it doesn't build arbitrary
# commits on demand.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to redeploy - must already be built and pushed to main (has sha-<short-sha> images published)'
        required: true
        type: string

concurrency:
  group: sandbox-ci
  cancel-in-progress: false

jobs:
  build-knooppunt:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-nuts-knooppunt-image.yaml
    secrets: inherit

  build-pep:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-pep-image.yaml
    secrets: inherit

  build-mock-vc-issuer:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-mock-vc-issuer-image.yaml
    secrets: inherit

  build-mock-mitz:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-mock-mitz-image.yaml
    secrets: inherit

  build-mock-dezi:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-mock-dezi-image.yaml
    secrets: inherit

  build-gf-sandbox:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-gf-sandbox-image.yaml
    secrets: inherit

  build-fakenvi:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-fakenvi-image.yaml
    secrets: inherit

  build-seed:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-seed-image.yaml
    secrets: inherit

  deploy:
    needs:
      - build-knooppunt
      - build-pep
      - build-mock-vc-issuer
      - build-mock-mitz
      - build-mock-dezi
      - build-gf-sandbox
      - build-fakenvi
      - build-seed
    # needs: jobs that were skipped (workflow_dispatch) still let this run;
    # only a genuine build failure (push) blocks it.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    environment: ovhcloud-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.OVHCLOUD_SANDBOX_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          # Matches the docker/metadata-action `type=sha,format=short` tag
          # rule every build-*-image.yaml above now publishes.
          tag="sha-$(echo "${{ github.event.inputs.commit || github.sha }}" | cut -c1-7)"
          infra/ovhcloud-sandbox/deploy.sh --timeout 10m \
            --set "image.tag=$tag" \
            --set "pep-zonnebloem.image.tag=$tag" \
            --set "pep-plataan.image.tag=$tag" \
            --set "fhir.image.tag=$tag" \
            --set "mock-vc-issuer.image.tag=$tag" \
            --set "mock-mitz.image.tag=$tag" \
            --set "mock-dezi.image.tag=$tag" \
            --set "gf-sandbox.image.tag=$tag" \
            --set "seed.image.tag=$tag"
