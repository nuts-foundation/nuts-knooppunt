---
name: 'Lint GitHub Actions workflows'

# ci.yaml never runs on a pull request (only push to main and dispatch), so
# a broken reusable-workflow call - a bad input, a typo'd `uses:` path -
# would otherwise only surface after merging to main, when GitHub rejects
# the whole run before any job starts and nothing deploys. actionlint
# catches this class of mistake at PR time instead. Deliberately a separate
# workflow rather than a pull_request trigger on ci.yaml itself - that
# would also run the deploy job.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: |
          # -shellcheck=: this check exists to catch broken reusable-workflow
          # calls (bad inputs, typo'd uses: paths) and similar workflow-level
          # mistakes, not to enforce shellcheck cleanliness across the whole
          # repo. Without this, actionlint lints every run: script in every
          # workflow file (not just the ones this PR touches), so a
          # pre-existing shellcheck nit anywhere blocks unrelated PRs.
          ./actionlint -color -shellcheck=
