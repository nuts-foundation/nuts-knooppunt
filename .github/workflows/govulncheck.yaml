---
name: 'govulncheck'

# Reports known vulnerabilities in Go modules and the standard library that the
# knooppunt binary can reach (static analysis, https://go.dev/blog/vuln; for an
# advisory without symbol data, any use of the module counts). Only the knooppunt
# itself is scanned (the root package), not the mocks, the sandbox or the test
# harness that share its module.
#
# A pull request only fails on what it adds: reachable findings that its base
# branch does not have. Findings on the base branch already are tracked on main.
#
# On main (pushes, the weekday schedule and manual runs) the track job scans the
# whole binary and keeps one open issue with the govulncheck label for every
# advisory that needs attention: a new advisory opens one and posts to Slack, and
# an issue is closed once main no longer reports its advisory. An advisory
# accepted in .github/govulncheck-accepted.txt gets no issue (that file says when
# an acceptance holds). Each run compares a fresh scan of main with the open
# issues, not with an earlier run, so a run that is cancelled or fails loses
# nothing: the next run catches up, Slack message included. On main only errors
# fail the workflow.
on:
  schedule:
    # Weekdays at 08:15 UTC, after the smoke test.
    - cron: '15 8 * * 1-5'
  # Pushes to main and pull requests run when Go code, the dependencies or the
  # check itself change. Go code counts as well: a call can make a vulnerable
  # function reachable without a change to go.mod.
  push:
    branches:
      - main
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yaml
      - .github/govulncheck-accepted.txt
  # To any base branch, so that a pull request stacked on another one is checked
  # too.
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yaml
      - .github/govulncheck-accepted.txt
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicitly, so that run steps get -o pipefail.
    shell: bash

jobs:
  # Pull requests, and manual runs on a branch other than main.
  scan:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # A newer run for the same pull request or branch replaces this one.
    concurrency:
      group: govulncheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # On a pull request this is the test merge commit, whose first parent
          # is the base branch.
          fetch-depth: 2

      # The steps with an anchor (&name) run in the track job as well.
      - &setup-go
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Not cached: the Actions cache is shared with the image builds and
          # runs out of space.
          cache: false

      # The govulncheck version is bumped by hand: Dependabot does not see run
      # commands. In JSON mode govulncheck exits 0 whatever it finds, and
      # non-zero only when it cannot run. The check step decides on the findings.
      - &govulncheck
        name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json . > govulncheck.json

      # On a pull request, the base branch is scanned as well, so that only what
      # the pull request adds counts. Both scans start from the Go toolchain set up
      # from the pull request's go.mod (Go switches to a newer one if the base asks
      # for it), not from the base's own, so a pull request that only changes the
      # Go version may show no difference here; main reports standard library
      # findings either way.
      - name: Run govulncheck on the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          (cd "$RUNNER_TEMP/base" && go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json .) > base.json

      - &check
        name: Check findings against the accepted list
        run: |
          export LC_ALL=C
          # Output that is not symbol-level protocol v1 is not something this
          # check understands; fail rather than report nothing.
          outputs=(govulncheck.json)
          if [ -f base.json ]; then
            outputs+=(base.json)
          fi
          for output in "${outputs[@]}"; do
            if ! jq -e -s 'any(.[]; .config.scan_level? == "symbol" and ((.config.protocol_version? // "") | startswith("v1.")))' "$output" > /dev/null; then
              echo "::error::${output} is not symbol-level govulncheck output in protocol v1"
              exit 1
            fi
          done

          # Reachable findings (the symbol-level ones): ID, module and fixed
          # version, empty when there is none. Separated by |, which read does
          # not collapse the way it collapses tabs.
          jq -r 'select(.finding.trace[0].function != null) | .finding | [.osv, .trace[0].module, (.fixed_version // "")] | join("|")' govulncheck.json | sort -u > findings.txt
          cut -d'|' -f1 findings.txt | sort -u > found.txt

          # On a pull request, only findings that the base branch does not have
          # count; main tracks the others. A finding is an advisory in a module:
          # an advisory that the base reaches in one module and the pull request
          # reaches in another counts as new.
          : > new-pairs.txt
          if [ -f base.json ]; then
            jq -r 'select(.finding.trace[0].function != null) | .finding | [.osv, .trace[0].module] | join("|")' base.json | sort -u > base-pairs.txt
            cut -d'|' -f1,2 findings.txt | sort -u > head-pairs.txt
            comm -23 base-pairs.txt head-pairs.txt | while IFS='|' read -r id module; do
              echo "::notice::${id} in ${module} is no longer reported with this pull request"
            done
            echo "::notice::$(comm -12 base-pairs.txt head-pairs.txt | cut -d'|' -f1 | sort -u | wc -l | tr -d ' ') reachable vulnerabilities are on the base branch already; main tracks those"
            comm -13 base-pairs.txt head-pairs.txt > new-pairs.txt
            awk -F'|' 'NR == FNR { new[$1 "|" $2]; next } ($1 "|" $2) in new' new-pairs.txt findings.txt > new-findings.txt
            mv new-findings.txt findings.txt
          fi

          # Modules that are in the binary only because of the embedded nuts-node:
          # walk the knooppunt's import graph without entering nuts-node packages,
          # and whatever stays out of reach comes in through nuts-node alone.
          # Findings that are all in those modules, or in nuts-node itself, are
          # labelled "via nuts-node". The standard library and anything our own
          # code imports are never labelled.
          go list -deps -json . > deps.json
          jq -r -s '
            (map({key: .ImportPath, value: {m: (.Module.Path // "std"), i: (.Imports // [])}}) | from_entries) as $g
            | {seen: {}, todo: (map(select(.Name == "main" and (.Module.Main // false))) | map(.ImportPath))}
            | until((.todo | length) == 0;
                .todo[0] as $p | .todo |= .[1:]
                | if .seen[$p] then . else
                    .seen[$p] = true
                    | if $g[$p].m == "github.com/nuts-foundation/nuts-node" then . else .todo += $g[$p].i end
                  end)
            | ([.seen | keys[] | $g[.].m] | unique) as $without
            | [$g[] | .m] | unique | map(select(. as $m | $without | index($m) | not)) | .[]' deps.json > via-nuts-node-modules.txt
          echo "github.com/nuts-foundation/nuts-node" >> via-nuts-node-modules.txt
          jq -r -s --rawfile mods via-nuts-node-modules.txt '
            ($mods | split("\n")) as $vm
            | [.[] | select(.finding.trace[0].function != null) | .finding | {id: .osv, m: .trace[0].module}]
            | group_by(.id) | map(select(all(.[]; .m as $m | $vm | index($m))) | .[0].id) | .[]' govulncheck.json | sort -u > via-nuts-node.txt
          via_label() { grep -qxF "$1" via-nuts-node.txt && echo " (via nuts-node)" || true; }

          # Accepted entries: an ID, optionally followed by the last day it also
          # holds when a fixed version is known.
          sed -e 's/#.*//' .github/govulncheck-accepted.txt | awk 'NF { print $1 "|" $2 }' | sort -u > accepted-entries.txt
          while IFS='|' read -r id until_date; do
            if [ -n "$until_date" ] && [ "$(date -u -d "$until_date" +%F 2>/dev/null)" != "$until_date" ]; then
              echo "::error::${until_date} after ${id} in .github/govulncheck-accepted.txt is not a YYYY-MM-DD date"
              exit 1
            fi
          done < accepted-entries.txt
          cut -d'|' -f1 accepted-entries.txt | sort -u > accepted.txt
          today="$(date -u +%F)"

          comm -13 found.txt accepted.txt | while read -r id; do
            echo "::warning::${id} is no longer reported; remove it from .github/govulncheck-accepted.txt"
          done

          # A finding needs attention when it is not accepted, or when a fixed
          # version is known and the acceptance has no date or has expired. On a
          # pull request that fails the check; on main it gets an issue.
          if [ -f base.json ]; then
            level=error
          else
            level=warning
          fi
          : > failing.txt
          while IFS='|' read -r id module fixed; do
            if ! grep -qxF "$id" accepted.txt; then
              echo "$id" >> failing.txt
              continue
            fi
            until_date="$(awk -F'|' -v id="$id" '$1 == id { print $2; exit }' accepted-entries.txt)"
            if [ -z "$fixed" ]; then
              echo "::notice::${id}$(via_label "$id") is reachable but accepted in .github/govulncheck-accepted.txt"
            elif [ -n "$until_date" ] && [[ ! "$today" > "$until_date" ]]; then
              echo "::notice::${id}$(via_label "$id") has a fix in ${fixed} (${module}) but is accepted until ${until_date}"
            else
              echo "::${level}::${id}$(via_label "$id") is accepted, but ${module} has a fix in ${fixed}; bump it, or accept it until a date"
              echo "$id" >> failing.txt
            fi
          done < findings.txt
          sort -u -o failing.txt failing.txt

          # Outside a pull request, list the advisories that need attention in
          # tracked.json, from which the track job keeps the issues on main.
          if [ ! -f base.json ]; then
            jq -n --rawfile ids failing.txt --rawfile via via-nuts-node.txt --rawfile rows findings.txt \
              --slurpfile osv <(jq -c 'select(.osv) | .osv | {id, summary}' govulncheck.json) '
              ($osv | map({key: .id, value: .summary}) | from_entries) as $summaries
              | ($rows | split("\n") | map(select(length > 0) | split("|"))) as $rows
              | ($via | split("\n")) as $via
              | [$ids | split("\n")[] | select(length > 0) | . as $id
                  | {id: $id, summary: ($summaries[$id] // ""), via: (($via | index($id)) != null),
                     modules: ([$rows[] | select(.[0] == $id) | {module: .[1], fixed: .[2]}] | unique)}]' > tracked.json
            {
              echo "### Reachable advisories that need attention: $(jq length tracked.json)"
              echo
              jq -r '.[] | "- \(.id)\(if .via then " (via nuts-node)" else "" end) \(.summary) https://pkg.go.dev/vuln/\(.id)"' tracked.json
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -s failing.txt ]; then
            # Name the modules in which the advisory is new.
            jq -r --rawfile ids failing.txt --rawfile via via-nuts-node.txt --rawfile newpairs new-pairs.txt '
              .osv? // empty | .id as $id
              | select($ids | split("\n") | index($id))
              | (if ($via | split("\n") | index($id)) then " (via nuts-node)" else "" end) as $suffix
              | [$newpairs | split("\n")[] | split("|") | select(.[0] == $id) | .[1]] as $modules
              | (if ($modules | length) > 0 then " (new in \($modules | join(", ")))" else "" end) as $where
              | "\($id)\($suffix)\($where) \(.summary) https://pkg.go.dev/vuln/\($id)"' govulncheck.json | sort -u > failing-details.txt
            cat failing-details.txt
            count="$(wc -l < failing.txt | tr -d ' ')"
            via_count="$(grep -c ' (via nuts-node) ' failing-details.txt || true)"
            {
              echo "### Reachable vulnerabilities that this pull request adds"
              echo
              echo "${via_count} of them are in modules that only the embedded nuts-node brings in."
              echo
              sed 's/^/- /' failing-details.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::This pull request adds ${count} reachable vulnerabilities; fix them or add an entry to .github/govulncheck-accepted.txt"
            exit 1
          fi

  # Main: one open issue for every advisory that needs attention.
  track:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # One run at a time, so that two runs never open the same issue twice. Each
    # run scans main as it is when the run starts, also on a re-run, so the last
    # run always applies the newest scan. A run that has to wait can be replaced
    # by a newer one; that loses nothing.
    concurrency:
      group: govulncheck-track
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - *setup-go
      - *govulncheck
      - *check

      # Each advisory has one open issue with the govulncheck label, found by the
      # marker in its body. The REST API lists them: gh issue list searches when
      # it filters on a label, and the search index can lag behind. A new issue
      # keeps the govulncheck-unannounced label until Slack has the message about
      # it, so a run that fails in between leaves the message to the next run.
      # SLACK_WEBHOOK is a Slack incoming webhook. Slack reads &, < and > as
      # control characters, so they are escaped.
      - name: Update the govulncheck issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export LC_ALL=C
          jq -e 'type == "array"' tracked.json > /dev/null
          sha="$(git rev-parse --short=7 HEAD)"
          label=govulncheck
          unannounced=govulncheck-unannounced
          gh label create "$label" --color B60205 --description "Reachable vulnerability that govulncheck reports on main" --force > /dev/null
          gh label create "$unannounced" --color FBCA04 --description "govulncheck issue that Slack has not heard about yet" --force > /dev/null

          gh api --paginate "repos/${GH_REPO}/issues?labels=${label}&state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | {number, title, url: .html_url, body: (.body // ""), labels: [.labels[].name]}' |
            jq -s . > open-issues.json
          jq -r '.[] | (.body | capture("<!-- govulncheck:(?<id>GO-[0-9]+-[0-9]+) -->").id) as $id | "\($id) \(.number)"' open-issues.json | sort > open.txt

          # The issues that Slack has to hear about, as number, URL and title
          # separated by tabs: the ones that an earlier run could not announce,
          # and the ones opened below.
          jq -r --arg unannounced "$unannounced" '.[] | select(.labels | index($unannounced)) | [.number, .url, .title] | @tsv' open-issues.json > announce.txt

          jq -c '.[]' tracked.json | while read -r advisory; do
            id="$(jq -r .id <<< "$advisory")"
            jq -r '
              "<!-- govulncheck:\(.id) -->",
              "**\(.id)**: \(.summary)",
              "",
              "https://pkg.go.dev/vuln/\(.id)",
              "",
              "The knooppunt binary on main reaches it in:",
              "",
              (.modules[] | "- \(.module)" + (if .fixed != "" then ", fixed in \(.fixed)" else ", no fixed version known yet" end)),
              "",
              (if .via then "These modules come in through the embedded nuts-node only.\n" else empty end),
              "Bump the module, or accept the advisory in `.github/govulncheck-accepted.txt` with a reason. The govulncheck workflow updates this issue on every run on main and closes it once main no longer reports the advisory; closing it by hand does not keep it closed."' <<< "$advisory" > body.md
            number="$(awk -v id="$id" '$1 == id { print $2; exit }' open.txt)"
            if [ -n "$number" ]; then
              # Only when something changed, so that the issue's history shows
              # real changes.
              current="$(jq -r --argjson number "$number" '.[] | select(.number == $number) | .body' open-issues.json)"
              if [ "$current" != "$(cat body.md)" ]; then
                gh issue edit "$number" --body-file body.md > /dev/null
              fi
            else
              # GitHub allows 256 characters in a title.
              title="$(jq -r '"govulncheck: \(.id) \(.summary)" | .[0:250]' <<< "$advisory")"
              url="$(gh issue create --title "$title" --label "$label" --label "$unannounced" --body-file body.md)"
              printf '%s\t%s\t%s\n' "${url##*/}" "$url" "$title" >> announce.txt
            fi
          done

          # Close the issues of advisories that main no longer reports: fixed,
          # no longer reachable, or accepted.
          jq -r '.[].id' tracked.json | sort -u > tracked-ids.txt
          : > closed.txt
          cut -d' ' -f1 open.txt | sort -u | comm -23 - tracked-ids.txt | while read -r id; do
            awk -v id="$id" '$1 == id { print $2 }' open.txt | while read -r number; do
              gh issue close "$number" --comment "Main no longer reports ${id} at ${sha}: it is fixed, no longer reachable, or accepted in .github/govulncheck-accepted.txt." > /dev/null
              echo "$number" >> closed.txt
            done
          done

          # A closed issue needs no announcement. The label comes off once Slack
          # has the message. Slack truncates a message above 40,000 characters, so
          # a message lists at most 25 issues: with titles of at most 250
          # characters, that stays below the limit even when escaped.
          awk -F'\t' 'FILENAME == ARGV[1] { closed[$1]; next } !($1 in closed)' closed.txt announce.txt > announce-open.txt
          if [ -s announce-open.txt ]; then
            count="$(wc -l < announce-open.txt | tr -d ' ')"
            split -l 25 announce-open.txt announce-part-
            for part in announce-part-*; do
              text=":warning: govulncheck: ${count} new reachable vulnerabilities on main. Run: ${RUN_URL}"$'\n'"$(awk -F'\t' '{ sub(/^govulncheck: /, "", $3); print $3 " " $2 }' "$part")"
              jq -n --arg text "$text" '{text: ($text | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))}' |
                curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK"
              cut -f1 "$part" | while read -r number; do
                gh issue edit "$number" --remove-label "$unannounced" > /dev/null
              done
            done
          fi

      # SLACK_WEBHOOK is a Slack incoming webhook.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg text ":warning: govulncheck failed on main. Run: ${RUN_URL}" '{text: $text}' |
            curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK"
