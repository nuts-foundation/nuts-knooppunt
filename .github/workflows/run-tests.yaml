name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up OPA
      uses: open-policy-agent/setup-opa@v2
      with:
        version: 1.x

    - name: Run OPA policy tests
      run: |
        set -o pipefail
        opa test component/pdp/policies/ --coverage --format=json | tee /tmp/opa-coverage.json
        coverage=$(jq -r '.coverage' /tmp/opa-coverage.json)
        echo "## OPA Policy Coverage: ${coverage}%" >> "$GITHUB_STEP_SUMMARY"

    - name: Check OPA policy syntax
      run: opa check --strict component/pdp/policies/

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          test/testdata/go.sum

    - name: Download dependencies
      run: go mod download

    # The e2e tests run against this build of the HAPI image (mock-components/hapi) rather than the
    # published :main, so a change to the mock NVI or LRZA is tested in the pull request that makes it.
    - name: Build the HAPI image with the mock interceptors
      run: docker build -t knooppunt-hapi:ci -f mock-components/hapi/Dockerfile mock-components

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: mock-components/**/pom.xml

    # The LRZA interceptor's profile validation tests need the IG packages, which the image build
    # downloaded; they are taken from there rather than downloaded twice.
    - name: Run mock interceptor tests
      env:
        LRZA_PACKAGES_DIR: ${{ runner.temp }}/lrza-packages
      run: |
        container=$(docker create knooppunt-hapi:ci)
        docker cp "$container:/app/lrza-packages" "$LRZA_PACKAGES_DIR"
        docker rm "$container"
        mvn -B test -f mock-components/lrza/hapi-lrza-interceptor/pom.xml
        mvn -B test -f mock-components/nvi/hapi-pseudonimization-interceptor/pom.xml

    - name: Run Go tests
      env:
        KNPT_HAPI_IMAGE: knooppunt-hapi:ci
      run: go test -p 1 -v ./...

    - name: Run shared NVI client tests
      run: go test ./vectors/nvi
      working-directory: test/testdata

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: pep/nginx/js/package-lock.json

    - name: Run sandbox viewer tests
      run: node --test sandbox/app/step-events.test.mjs

    - name: Install PEP test dependencies
      run: npm ci
      working-directory: pep/nginx/js

    - name: Run PEP tests
      run: npm test
      working-directory: pep/nginx/js
