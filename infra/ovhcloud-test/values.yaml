# Environment values for the OVHcloud MKS "gf-test" cluster (infra/cluster).
#
# Deploys the full test stack: knooppunt, hapi-fhir (as fake-nvi), both
# PEPs, nutsadmin, mock-vc-issuer, mock-mitz, mock-dezi, mock-prs, gf-sandbox
# with its trace Collector, and the seed Job (nuts-knooppunt#572) that
# populates it with demo data.
#
# Hosts live under *.test.gf.nuts.nl (nuts-knooppunt#563): a wildcard A
# record pointing at the ingress-nginx controller's LoadBalancer IP.
#
# TLS via cert-manager (nuts-knooppunt#610), HTTP-01 challenge solved
# through this same ingress-nginx - see infra/cert-manager/. Validated
# against letsencrypt-staging manually before this went in, so every
# cluster-issuer annotation below goes straight to letsencrypt-production.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  hosts:
    - host: knooppunt.test.gf.nuts.nl
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - knooppunt.test.gf.nuts.nl
      secretName: knooppunt-tls

# The embedded nuts-node's own public base URL - used for did:web
# identifiers, must match the public ingress host above.
extraEnv:
  - name: NUTS_URL
    value: "https://knooppunt.test.gf.nuts.nl/nuts"
  # Setting this REPLACES the node's own built-in defaults rather than
  # adding to them (nuts-node vcr/vcr.go:170-184), so both have to be
  # repeated here: mock-dezi's public ingress URL (matches mock-dezi's own
  # deziJku below) and the two public dezi.nl URLs, which the node would
  # otherwise still accept. Dropping either silently stops validating
  # attestations from that source. Without this at all, every Dezi
  # id_token fails closed: "fetching url ... rejected by whitelist".
  - name: NUTS_VCR_DEZI_ALLOWEDJKU
    value: "https://mock-dezi.test.gf.nuts.nl/dezi/jwks.json,https://auth.dezi.nl/dezi/jwks.json,https://acceptatie.auth.dezi.nl/dezi/jwks.json"
  # Export spans every 250 ms instead of the Go SDK's 5 s, as
  # docker-compose.sandbox.yml does: the viewer waits about a second for a
  # PRS span before it reports the evidence as unavailable.
  - name: OTEL_BSP_SCHEDULE_DELAY
    value: "250"

# The NVI component is disabled unless baseurl is set
# (component/nvi/component.go: Enabled() is FHIRBaseURL != ""). Matches
# docker-compose.yml's KNPT_NVI_BASEURL: http://hapi-fhir:7050/fhir/nvi -
# same "/fhir/<tenant>" shape, our fhir service instead of hapi-fhir.
config:
  nvi:
    baseurl: "http://fhir:8080/fhir/nvi"
    # The NVI's URA, the recipient the knooppunt pseudonymizes for: what
    # mock-prs registers a key for (docs/CONFIGURATION.md).
    audience: "90000901"
  # Same gap, same fix: component/mitz.Enabled() requires mitzbase, and it
  # was never set. Needed for BGZ authorization (its policy requires Mitz
  # consent - mock-mitz's closed-question endpoint supplies that answer).
  # The separate subscription flow (/abonnementen/fhir) mock-mitz doesn't
  # implement yet - sandbox/DESIGN.md E8, not a config problem.
  mitz:
    mitzbase: "http://mock-mitz:8080"
  # Same gap once more, for authorization: without a PIP the PDP can't
  # resolve a Patient to a BSN, never asks Mitz for consent, and denies every
  # request with an opaque 403. Matches docker-compose.yml's
  # KNPT_PDP_PIP_URL, including its caveat: this makes the PDP
  # single-data-holder (Zonnebloem), fine while it is the only organization
  # serving data through a PEP.
  pdp:
    pip:
      url: "http://fhir:8080/fhir/sunflower-patients"
  # Same gap again, for addressing. Matches docker-compose.yml's
  # KNPT_LRZA_LRZABASEURL / KNPT_LRZA_QUERYBASEURL:
  # - The seeded central addressing directory (lrza-root-directory) is
  #   synced wholesale by component/lrza, not discovered by component/mcsd.
  #   Without this, `POST /lrza/update` has nothing to sync and the query
  #   directory stays empty, so the demo organizations are findable but not
  #   addressable.
  # - The query directory must be the knpt-mcsd-query tenant: that is where
  #   gf-sandbox resolves addresses (sandbox/app/mcsdclient.go), not the
  #   chart's default of HAPI's default partition.
  lrza:
    lrzabaseurl: "http://fhir:8080/fhir/lrza-root-directory"
    querybaseurl: "http://fhir:8080/fhir/knpt-mcsd-query"
  # Pseudonymize through mock-prs with the same authn flow as against the
  # ministry, as docker-compose.sandbox.yml does: a client certificate, a
  # token request to the mock's stand-in token endpoint, a bearer on the PRS
  # call. Without prsurl the knooppunt falls back to its built-in XOR fake
  # and makes no PRS call at all. The certificate is mock-prs's generated
  # client-cert Secret, mounted below: the mock checks neither it nor the
  # signed assertion, but component/authn refuses a token endpoint without one.
  pseudo:
    prsurl: "http://mock-prs:8080"
  authn:
    minvws:
      tokenendpoint: "http://mock-prs:8080/oauth/token"
      tlscertfile: /certs/prs/tls.crt
      tlskeyfile: /certs/prs/tls.key
  # Traces to gf-sandbox's Collector, which turns the PRS client spans into
  # viewer events (gf-sandbox.traceCapture below). The knooppunt's logs go
  # there as well instead of to its stdout, the embedded nuts-node's
  # included (lib/logging routes logrus through slog), so they are read from
  # that Collector's pod. Only the nuts-node's audit log stays on stdout.
  tracing:
    otlpendpoint: "gf-sandbox-otel-collector:4318"

nutsConfig:
  discovery:
    server:
      ids:
        - bgz-test

# The chart's own appVersion ("0.0.0") is a placeholder only ever filled in
# correctly by the release CI (see helm/README.md); it was never published as
# an image tag, so installing without this override 404s on image pull.
image:
  tag: main

# Persistent storage (nuts-knooppunt#586): one shared Postgres server for
# HAPI and the embedded nuts-node, plus a volume for the nuts-node's crypto
# keys. Requires the CloudNativePG operator on the cluster, see
# helm/nuts-knooppunt/README.md. Before this, HAPI's tenant partitions and
# every did:web subject were gone on each pod restart.
database:
  enabled: true
persistence:
  enabled: true
# Same CSI volume ownership issue as mock-vc-issuer below: the knooppunt
# image runs as uid 18081 (Dockerfile).
podSecurityContext:
  fsGroup: 18081
# The client certificate config.authn.minvws points at.
volumes:
  - name: prs-client-cert
    secret:
      secretName: mock-prs-client-cert
volumeMounts:
  - name: prs-client-cert
    mountPath: /certs/prs
    readOnly: true

pep-zonnebloem:
  enabled: true
  # Same appVersion-placeholder issue as the root chart - "1.16.0" was never
  # published for ghcr.io/nuts-foundation/knooppunt-pep.
  image:
    tag: main
  # The HAPI tenant this PEP protects, as in docker-compose.yml's
  # FHIR_UPSTREAM_PATH. Without it the PEP forwards to HAPI's default
  # partition and every authorized read 400s.
  env:
    fhirUpstreamPath: "/fhir/sunflower-patients"

pep-plataan:
  enabled: true
  image:
    tag: main
  env:
    fhirUpstreamPath: "/fhir/plataan-patients"

fhir:
  enabled: true
  # The test environment runs a HAPI build with our NVI pseudonymization interceptor
  # baked in, not stock HAPI (see docker-compose.yml's hapi-fhir comment on
  # why :main specifically, not :latest).
  image:
    repository: ghcr.io/nuts-foundation/fake-nvi
    tag: main
  # HAPI uses ~900Mi on a node with ~2Gi allocatable. Without a request the
  # scheduler packed a rolling update's new pod next to the old one and the
  # node evicted its way out of it; Recreate makes sure there is never a
  # second HAPI to place at all.
  resources:
    requests:
      memory: 1Gi
  strategy:
    type: Recreate
  # Off on purpose: the subchart would provision a Postgres server of its
  # own. HAPI uses the shared one from `database` above instead, wired here
  # by hand because a subchart's values can't reference the parent chart's
  # templates. Names follow the chart's fullnameOverride ("nuts-knooppunt")
  # and database name ("fhir"); the env keys are the ones the subchart sets
  # itself when postgres.enabled is true.
  postgres:
    enabled: false
  extraEnv:
    - name: spring.jpa.properties.hibernate.dialect
      value: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    - name: spring.datasource.driverClassName
      value: org.postgresql.Driver
    - name: spring.datasource.url
      value: "jdbc:postgresql://nuts-knooppunt-db-rw:5432/fhir"
    - name: spring.datasource.username
      value: fhir
    - name: spring.datasource.password
      valueFrom:
        secretKeyRef:
          name: nuts-knooppunt-db-fhir
          key: password
    # The knooppunt registers and searches with mock-prs's blinded values,
    # which the NVI interceptor de-tokenizes through mock-prs's sandbox
    # helper, as in docker-compose.sandbox.yml. Without it the interceptor
    # expects the XOR fake's tokens. Here rather than in configExtra because
    # the subchart does not restart HAPI when only its ConfigMap changes.
    - name: PRS_MOCK_URL
      value: "http://mock-prs:8081"
  configExtra:
    NVI_AUDIENCE: "nvi"
    NVI_TENANT: "nvi"
    "hapi.fhir.allow_cascading_deletes": "true"
    "hapi.fhir.client_id_strategy": "ANY"
    "hapi.fhir.delete_expunge_enabled": "true"
    "hapi.fhir.allow_multiple_delete": "true"
    "hapi.fhir.partitioning.allow_references_across_partitions": "false"

nutsadmin:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - host: nutsadmin.test.gf.nuts.nl
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - nutsadmin.test.gf.nuts.nl
        secretName: nutsadmin-tls

mock-vc-issuer:
  enabled: true
  # Same appVersion-placeholder issue as above - "0.1.0" was never published
  # for ghcr.io/nuts-foundation/mock-vc-issuer.
  image:
    tag: main
  # OVH's CSI-backed PVC mounts owned by root by default; the image runs as
  # uid 1001 (mock-components/vc-issuer/Dockerfile: `USER nextjs`), which
  # can't write /app/data without this - Prisma's migration step failed with
  # "unable to open database file" until this was set.
  podSecurityContext:
    fsGroup: 1001

mock-mitz:
  enabled: true

mock-dezi:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - host: mock-dezi.test.gf.nuts.nl
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - mock-dezi.test.gf.nuts.nl
        secretName: mock-dezi-tls
  env:
    # Must match gf-sandbox's public callback below. https, not http - once
    # a host has a tls: block, ingress-nginx redirects http to https by
    # default, and this is matched exactly by the OAuth2 redirect check.
    deziAllowedRedirectUris: "https://sandbox.test.gf.nuts.nl/demo/auth/callback"
    # The chart default (mock-dezi:8443) is served over mock-dezi's own
    # self-signed cert ("GF Sandbox Demo CA" - see helm/mock-dezi's
    # certsSecretName), which the node doesn't trust, failing every
    # retrieve with "certificate signed by unknown authority". /dezi/jwks.json
    # is on the same mux as /authorize (mock-components/dezi/main.go) - it
    # was already reachable on the plain HTTP port, just never exposed
    # there - so routing it through the public ingress instead gets a real,
    # already-trusted Let's Encrypt cert for free, with no cert-trust
    # wiring needed at all. Confirmed hairpin routing (pod -> public
    # ingress -> back into the cluster) works on this LoadBalancer.
    deziJku: "https://mock-dezi.test.gf.nuts.nl/dezi/jwks.json"

# The PRS the knooppunt's config.pseudo points at and the NVI's PRS_MOCK_URL
# de-tokenizes through. Its chart default PUBLIC_URL, http://mock-prs:8080,
# is the prsurl above.
mock-prs:
  enabled: true

gf-sandbox:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      # Not gf-sandbox.test.gf.nuts.nl - the domain already has "gf" in it.
      - host: sandbox.test.gf.nuts.nl
        paths:
          - path: /
            pathType: ImplementationSpecific
      # De Zonnebloem's EHR, served by the same pod on its own port.
      - host: zonnebloem-ehr.test.gf.nuts.nl
        servicePort: 3001
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - sandbox.test.gf.nuts.nl
        secretName: sandbox-tls
      - hosts:
          - zonnebloem-ehr.test.gf.nuts.nl
        secretName: zonnebloem-ehr-tls
  env:
    deziPublicAuthorizeUrl: "https://mock-dezi.test.gf.nuts.nl/authorize"
    sandboxPublicUrl: "https://sandbox.test.gf.nuts.nl"
  zonnebloemEhr:
    enabled: true
    publicUrl: "https://zonnebloem-ehr.test.gf.nuts.nl"
  # PRS evidence in the viewer. prsUrl must equal the knooppunt's
  # config.pseudo.prsurl, whose spans are the ones it picks out.
  traceCapture:
    enabled: true
    prsUrl: "http://mock-prs:8080"

seed:
  enabled: true
  # Same appVersion-placeholder issue as the other components above - "0.0.0"
  # was never published for ghcr.io/nuts-foundation/knooppunt-sandbox-seed.
  image:
    tag: main
    # A moving tag: without this, a node that already pulled "main" keeps
    # running the old seed on every upgrade.
    pullPolicy: Always
  # The chart default (localhost:8080) only resolves inside the seed's own
  # container. A consumer elsewhere in the cluster needs the node's real
  # public address, which the knooppunt itself can also reach for its own
  # metadata fetch - this node is the authorization server for both subjects.
  zonnebloemAuthServerAddress: "https://knooppunt.test.gf.nuts.nl/nuts/oauth2/00000020"
  plataanAuthServerAddress: "https://knooppunt.test.gf.nuts.nl/nuts/oauth2/00000010"
