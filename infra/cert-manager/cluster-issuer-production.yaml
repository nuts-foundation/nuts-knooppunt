# Same HTTP-01 setup as letsencrypt-staging.yaml, against Let's Encrypt's
# real, rate-limited, browser-trusted CA. Only switch an ingress to this
# issuer after confirming letsencrypt-staging actually issues successfully
# for that host - production allows just 5 duplicate certs per domain per
# week, easy to burn through while still debugging.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: replace with the team's actual ops contact before applying -
    # Let's Encrypt emails this address about certificate expiry problems.
    email: ops@nuts.nl
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
